# Android CI — assemble debug APK + run JVM unit tests (pure-Kotlin engine included).
name: Android

on:
  push:
    branches: [main]
    paths: ['android-app/**', 'Makefile', 'scripts/verify_local_first_apk.py', 'scripts/ci_test_report.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['android-app/**', 'Makefile', 'scripts/verify_local_first_apk.py', 'scripts/ci_test_report.py', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'integration/v1' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug and local-first release APK and AAB
        working-directory: android-app
        run: ./gradlew assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Verify release excludes accounts and network permissions
        run: |
          python3 scripts/verify_local_first_apk.py android-app/app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify_local_first_apk.py android-app/app/build/outputs/bundle/release/app-release.aab

      # `test` (not `testDebugUnitTest`): the pure-Kotlin modules (blocking-engine,
      # core-model) are kotlin.jvm projects whose test task is `test` — the old task name
      # silently skipped them, making the engine-test gate a false one (review P0-1).
      - name: Unit tests
        working-directory: android-app
        run: ./gradlew test

      - name: Summarize JUnit results
        if: always()
        run: python3 scripts/ci_test_report.py --title 'Android JVM unit tests' --junit 'android-app/**/build/test-results/test*/TEST-*.xml'

      - name: Record APK and source provenance
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=tar HEAD > artifacts/source.tar
          git rev-parse HEAD > artifacts/source-commit.txt
          sha256sum artifacts/source.tar > artifacts/SHA256SUMS
          find android-app/app/build/outputs/apk -name '*.apk' -type f -exec sha256sum {} \; >> artifacts/SHA256SUMS
          {
            echo '## Android build provenance'
            echo "Source commit: $(cat artifacts/source-commit.txt)"
            echo '```text'
            cat artifacts/SHA256SUMS
            echo '```'
            echo 'Source hash covers git archive --format=tar HEAD; APK hashes cover the uploaded binaries.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and build provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          retention-days: 14
          path: |
            android-app/**/build/reports/tests/
            android-app/**/build/test-results/test*/TEST-*.xml
            android-app/app/build/outputs/apk/**/*.apk
            artifacts/
