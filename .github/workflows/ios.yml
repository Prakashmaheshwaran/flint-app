# iOS CI — generate the project (XcodeGen), build app + 4 extensions for the Simulator
# (no signing), then run unit tests on the first available iPhone simulator.
# Reality check (matches the repo's honest-docs rule): CI verifies build + logic only;
# Screen Time shield enforcement can only be proven on a physical device.
name: iOS

on:
  push:
    branches: [main]
    paths: ['ios-app/**', 'docs/store/ios/**', 'Makefile', 'scripts/ci_test_report.py', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios-app/**', 'docs/store/ios/**', 'Makefile', 'scripts/ci_test_report.py', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Record test provenance
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          xcodebuild -version > artifacts/xcode-version.txt

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build (Simulator, no signing)
        run: |
          xcodebuild -project ios-app/Flint.xcodeproj -scheme Flint \
            -derivedDataPath ios-app/DerivedData \
            -resultBundlePath artifacts/build.xcresult \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Verify privacy manifests in host and every extension
        run: python3 docs/store/ios/verify-privacy-bundles.py ios-app/DerivedData/Build/Products/Debug-iphonesimulator/Flint.app

      - name: Unit tests (first available iPhone simulator)
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          xcodebuild test -project ios-app/Flint.xcodeproj -scheme Flint \
            -derivedDataPath ios-app/DerivedData \
            -resultBundlePath artifacts/unit-tests.xcresult \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarize Xcode unit tests as JUnit
        if: always()
        run: |
          python3 scripts/ci_test_report.py --title 'iOS simulator unit tests (not Screen Time enforcement)' \
            --xcresult artifacts/unit-tests.xcresult --output artifacts/ios-unit-tests.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-unit-test-results
          retention-days: 14
          path: artifacts/
