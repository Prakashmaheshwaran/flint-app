name: Android release smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['android-app/**', 'scripts/android-e2e.sh', 'scripts/android-release-instrumentation.sh', 'scripts/verify_instrumentation_result.py', 'scripts/ci_android_emulator.py', '.github/actions/android-emulator-cache/**', '.github/workflows/android-release-smoke.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'integration/v1' }}

jobs:
  release-smoke:
    if: github.event.pull_request.draft == false || github.head_ref == 'integration/v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Record source provenance
        run: |
          mkdir -p artifacts/android-e2e
          git rev-parse HEAD > artifacts/android-e2e/source-commit.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build release app and isolated test APK before emulator boot
        working-directory: android-app
        run: |
          ./gradlew -PflintE2E=true :app:assembleRelease :app:bundleRelease :e2e:assembleDebug 2>&1 | tee ../artifacts/android-e2e/build.log
          python3 ../scripts/verify_local_first_apk.py app/build/outputs/apk/release/app-release.apk
          python3 ../scripts/verify_local_first_apk.py app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print e2e/build/outputs/apk/debug/e2e-debug.apk > ../artifacts/android-e2e/test-manifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('../artifacts/android-e2e/test-manifest.xml').getroot()
          target = root.find('instrumentation').get('{http://schemas.android.com/apk/res/android}targetPackage')
          if target != root.get('package') or target != 'com.flint.peakfocus.test':
              raise SystemExit('Instrumentation must target its isolated test package')
          PY
      - uses: ./.github/actions/android-emulator-cache
      - name: Test installed release rule persistence and actual Accessibility shield
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: flint-ci-api36
          force-avd-creation: false
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: FLINT_E2E_DISPOSABLE=1 FLINT_E2E_VARIANT=release AVD=emulator-5554 bash scripts/android-e2e.sh
      - name: Retain exact release mapping and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-smoke-api36-${{ github.sha }}
          retention-days: 90
          path: |
            artifacts/android-e2e/
            android-app/app/build/outputs/mapping/release/
