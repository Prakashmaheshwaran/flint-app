# Attaches a downloadable Android APK to GitHub Releases.
# Runs when a release is published, or manually (workflow_dispatch) for an existing tag.
# HONESTY NOTE: the APK uses release code with development signing — an installable
# preview, not a Play Store build. Debug-only emulator tools are excluded.
name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      # Check out the TAG being released (review P1-1): without `ref`, manual dispatch
      # built default-branch HEAD but labeled the APK with the tag — mislabeled artifact.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Validate release versions before building or uploading
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: make release-check TAG="$RELEASE_TAG"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Development signing is retained, but release code excludes emulator account tools.
      - name: Assemble local-first preview APK
        working-directory: android-app
        run: ./gradlew :app:assembleRelease

      - name: Verify the packaged local-first boundary
        run: python3 scripts/verify_local_first_apk.py android-app/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          APK=$(ls android-app/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "flint-${TAG}-android-debug.apk"
          gh release upload "$TAG" "flint-${TAG}-android-debug.apk" --clobber
