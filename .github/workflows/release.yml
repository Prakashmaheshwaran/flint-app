# Attaches development-signed Android preview APK/AAB files to GitHub Releases.
# Runs when a release is published, or manually (workflow_dispatch) for an existing tag.
# Release code excludes debug-only account tools. This public workflow has no
# owner upload credentials; store bundles are built separately by the key owner.
name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      # Check out the TAG being released (review P1-1): without `ref`, manual dispatch
      # built default-branch HEAD but labeled the APK with the tag — mislabeled artifact.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Validate release versions before building or uploading
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: make release-check TAG="$RELEASE_TAG"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Development signing is retained, but release code excludes emulator account tools.
      - name: Build and test local-first development previews
        working-directory: android-app
        run: ./gradlew :app:assembleRelease :app:bundleRelease test

      - name: Verify the packaged local-first boundary
        run: |
          python3 scripts/verify_local_first_apk.py android-app/app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify_local_first_apk.py android-app/app/build/outputs/bundle/release/app-release.aab

      - name: Attach explicitly labeled development previews to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          APK="flint-${TAG}-android-development-preview.apk"
          AAB="flint-${TAG}-android-development-preview.aab"
          cp android-app/app/build/outputs/apk/release/app-release.apk "$APK"
          cp android-app/app/build/outputs/bundle/release/app-release.aab "$AAB"
          sha256sum "$APK" "$AAB" > "flint-${TAG}-android-development-preview.sha256"
          gh release upload "$TAG" "$APK" "$AAB" "flint-${TAG}-android-development-preview.sha256" --clobber
