name: Repository checks

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'Makefile', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', 'Makefile', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'integration/v1' }}

jobs:
  script-selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh for shell regression tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh
      - name: Verify device-free scripts
        run: make selftest
