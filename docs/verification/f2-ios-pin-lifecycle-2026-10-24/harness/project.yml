name: FlintAudit
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  FlintAuditUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flint.audit.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FlintAudit:
    build:
      targets:
        FlintAuditUITests: [test]
    test:
      targets: [FlintAuditUITests]
