name: FlintF6UI
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  FlintF6UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flint.f6.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FlintF6UI:
    build:
      targets:
        FlintF6UITests: [test]
    test:
      targets: [FlintF6UITests]
