name: FlintF4SecondaryTargetUI
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  FlintF4SecondaryTargetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flint.f4.secondary.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FlintF4SecondaryTargetUI:
    build:
      targets:
        FlintF4SecondaryTargetUITests: [test]
    test:
      targets: [FlintF4SecondaryTargetUITests]
