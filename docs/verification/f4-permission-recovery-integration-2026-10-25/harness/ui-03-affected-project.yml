name: FlintF4RecoveryUI
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  FlintF4RecoveryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flint.f4.recovery.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FlintF4RecoveryUI:
    build:
      targets:
        FlintF4RecoveryUITests: [test]
    test:
      targets: [FlintF4RecoveryUITests]
