name: PINFormPhase
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
packages:
  FlintCore:
    path: ../../../../../ios-app/Packages/FlintCore
targets:
  PINFormPhase:
    type: application
    platform: iOS
    sources:
      - App
      - ../../../../../ios-app/Flint/Features/Settings/PINSetupView.swift
      - ../../../../../ios-app/Flint/DesignSystem/FlintUI.swift
      - ../../../../../ios-app/Flint/DesignSystem/FlintAppearance.swift
      - path: ../../../../../ios-app/Flint/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: FlintCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flint.audit.f3-review-form
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  PINFormPhaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PINFormPhase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flint.audit.f3-review-form.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PINFormPhase:
    build:
      targets:
        PINFormPhase: all
        PINFormPhaseUITests: [test]
    test:
      targets: [PINFormPhaseUITests]
