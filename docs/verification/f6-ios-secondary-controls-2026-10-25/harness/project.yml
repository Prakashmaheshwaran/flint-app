name: FlintF6SecondaryUI
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  FlintF6SecondaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flint.f6.secondary.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FlintF6SecondaryUI:
    build:
      targets:
        FlintF6SecondaryUITests: [test]
    test:
      targets: [FlintF6SecondaryUITests]
