name: FlintF6AuthorizationUI
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  FlintF6AuthorizationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flint.f6.authorization.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FlintF6AuthorizationUI:
    build:
      targets:
        FlintF6AuthorizationUITests: [test]
    test:
      targets: [FlintF6AuthorizationUITests]
