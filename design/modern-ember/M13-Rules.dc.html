            <span style="font-size: 12px; color: #B7AE9F">{{s.when}}</span>

          <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #B7AE9F">

        <span style="display: flex; align-items: center; gap: 10px">

          <span style="display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 14px; font-weight: 600">Instagram</span>
            <span style="font-size: 12px; color: #B7AE9F; font-variant-numeric: tabular-nums">18 of 30 min</span>

      <a href="M15-LimitEditor.dc.html" style="flex: 0 0 auto; width: 176px; display: flex; flex-direction: column; gap: 10px; padding: 14px; box-sizing: border-box; border-radius: 20px; background: #17161A; border: 1px solid rgba(237, 230, 218, 0.08); text-decoration: none; color: #EDE6DA">
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="width: 32px; height: 32px; border-radius: 10px; background: #5A2A2A; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #D8CFC0">Y</span>
          <span style="display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 14px; font-weight: 600">YouTube</span>
            <span style="font-size: 12px; color: #B7AE9F; font-variant-numeric: tabular-nums">3 of 5 opens</span>
          </span>
        </span>

        <a href="M05-AppPicker.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #EDE6DA">

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-4.2-7"></path><circle cx="18.6" cy="6.4" r="1.6" fill="currentColor" stroke="none"></circle></svg>
      Today

    <a href="M13-Rules.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 28px; background: rgba(237, 230, 218, 0.1); text-decoration: none; color: #EDE6DA; font-size: 11px; font-weight: 600">

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="9" r="3.5"></circle><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"></path></svg>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const apps = [['Instagram', 'I', '#5C3344'], ['TikTok', 'T', '#2E2E33'], ['YouTube', 'Y', '#5A2A2A'], ['Reddit', 'R', '#6B3D2A'], ['X', 'X', '#26262A'], ['Snapchat', 'S', '#6B6230']];
    const resting = apps.map(([name, initial, bg]) => ({
      name, initial,
      tile: 'position: relative; width: 52px; height: 52px; border-radius: 15px; background: ' + bg + '; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1.5px rgba(239,159,39,0.5);'
    }));
    const card = 'flex: 0 0 auto; width: 196px; display: flex; flex-direction: column; gap: 12px; padding: 14px; box-sizing: border-box; border-radius: 22px; text-decoration: none; color: #EDE6DA; ';
    const schedules = [
      { name: 'Laser Focus', when: 'Weekdays · 09:00 — 12:00', status: '1h 02m left', verb: 'Block', more: '+5', active: true },
      { name: 'Gym Time', when: 'Mon Wed Fri · 17:30 — 19:00', status: 'Next · 17:30', verb: 'Block', more: '+5', active: false },
      { name: 'Reading Time', when: 'Every day · 20:00', status: 'Next · 20:00', verb: 'Block', more: '+2', active: false }
    ].map((s) => ({
      ...s,
      card: card + (s.active ? 'background: linear-gradient(180deg, rgba(239,159,39,0.16) 0%, rgba(239,159,39,0.04) 60%, #17161A 100%), #17161A; border: 1px solid rgba(239,159,39,0.35);' : 'background: #17161A; border: 1px solid rgba(237,230,218,0.08);'),
      lockWrap: 'width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: ' + (s.active ? 'rgba(239,159,39,0.18)' : 'rgba(237,230,218,0.08)') + ';',
      lockColor: s.active ? '#EF9F27' : '#EDE6DA',
      pill: 'align-self: flex-start; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; ' + (s.active ? 'background: rgba(239,159,39,0.18); color: #F4C27E;' : 'background: rgba(237,230,218,0.08); color: #B7AE9F;')
    }));
    const mini = (bg) => 'width: 100%; aspect-ratio: 1; border-radius: 8px; background: ' + bg + '; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #D8CFC0;';
    const groups = [
      { name: 'Always allowed', count: '3 apps', i1: 'P', i2: 'M', i3: 'C', i4: '', t1: mini('#2F4A3A'), t2: mini('#2A3E55'), t3: mini('#3A4A3A'), t4: mini('rgba(237,230,218,0.04)') },
      { name: 'Deep work', count: '7 apps', i1: 'I', i2: 'T', i3: 'Y', i4: '+4', t1: mini('#5C3344'), t2: mini('#2E2E33'), t3: mini('#5A2A2A'), t4: mini('rgba(237,230,218,0.08)') + ' color: #B7AE9F;' },
      { name: 'Doomscroll', count: '11 apps', i1: 'R', i2: 'X', i3: 'S', i4: '+8', t1: mini('#6B3D2A'), t2: mini('#26262A'), t3: mini('#6B6230'), t4: mini('rgba(237,230,218,0.08)') + ' color: #B7AE9F;' }
    ];
    return { resting, schedules, groups };
  }
}
</script>
