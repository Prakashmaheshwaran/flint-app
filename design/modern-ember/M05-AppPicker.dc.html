<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flint — Choose apps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#EDE6DA}a:hover{color:#B7AE9F}
button{font:inherit;cursor:pointer}
input::placeholder{color:#8F887C}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0E0D0F; color: #EDE6DA; font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif">

  <div style="position: relative; display: flex; flex-direction: column; padding: 54px 20px 0 20px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="M04-StartFocus.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(237, 230, 218, 0.08); display: flex; align-items: center; justify-content: center; color: #EDE6DA">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <div role="radiogroup" aria-label="Mode" style="display: flex; gap: 2px; padding: 3px; border-radius: 17px; background: rgba(237, 230, 218, 0.07)">
        <button type="button" role="radio" aria-checked="{{blockOn}}" onClick="{{setBlock}}" style="{{blockStyle}}">Block list</button>
        <button type="button" role="radio" aria-checked="{{allowOn}}" onClick="{{setAllow}}" style="{{allowStyle}}">Allow list</button>
      </div>
      <span style="width: 44px"></span>
    </div>

    <h1 style="margin: 16px 4px 0 4px; font-size: 32px; font-weight: 700; letter-spacing: -0.6px">{{title}}</h1>
    <p style="margin: 4px 4px 0 4px; font-size: 14px; color: #B7AE9F">{{subtitle}}</p>

    <div style="display: flex; gap: 8px; margin-top: 16px; overflow: hidden">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.pick}}" style="{{g.style}}">
          <span style="display: flex">
            <span style="{{g.m1}}">{{g.i1}}</span><span style="{{g.m2}}">{{g.i2}}</span>
          </span>
          {{g.name}} <span style="{{g.countStyle}}">{{g.count}}</span>
        </button>
      </sc-for>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 46px; margin-top: 12px; padding: 0 16px; border-radius: 23px; background: rgba(237, 230, 218, 0.05); border: 1px solid rgba(237, 230, 218, 0.08)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B7AE9F" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search apps</span>
      <input type="search" placeholder="Search apps and sites" style="flex: 1 1 auto; min-width: 0; height: 44px; border: none; outline: none; background: transparent; color: #EDE6DA; font: inherit; font-size: 15px">
    </label>

    <div style="display: flex; flex-direction: column; margin-top: 8px">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="7">
        <button type="button" role="checkbox" aria-checked="{{a.on}}" onClick="{{a.toggle}}" style="display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 4px; border: none; border-bottom: 1px solid rgba(237, 230, 218, 0.07); background: transparent; color: #EDE6DA; text-align: left">
          <span style="{{a.tile}}">{{a.initial}}</span>
          <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 600">{{a.name}}</span>
            <span style="font-size: 12px; color: #B7AE9F">{{a.meta}}</span>
          </span>
          <span style="{{a.check}}">
            <sc-if value="{{a.checked}}" hint-placeholder-val="{{true}}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A2003" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 20px 36px 20px; background: linear-gradient(180deg, rgba(14, 13, 15, 0) 0%, #0E0D0F 40%)">
    <a href="M04-StartFocus.dc.html" style="height: 56px; border-radius: 28px; background: #EDE6DA; color: #141316; text-decoration: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">Done · {{doneLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      allow: false, group: 'deep',
      picked: { Instagram: true, TikTok: true, YouTube: true, Reddit: true, X: true, Snapchat: true, Netflix: true }
    };
  }
  renderVals() {
    const list = [['Instagram', 'I', '#5C3344', 'Social · 48m today'], ['TikTok', 'T', '#2E2E33', 'Social · 31m today'], ['YouTube', 'Y', '#5A2A2A', 'Video · 22m today'], ['Reddit', 'R', '#6B3D2A', 'Social · 14m today'], ['X', 'X', '#26262A', 'Social · 9m today'], ['Snapchat', 'S', '#6B6230', 'Social · 6m today'], ['Netflix', 'N', '#4A1F22', 'Video'], ['Chrome', 'C', '#3A4A3A', 'Browser'], ['Messages', 'M', '#2F4A3A', 'Always allowed']];
    const apps = list.map(([name, initial, bg, meta]) => {
      const on = !!this.state.picked[name];
      return {
        name, initial, meta,
        on: on ? 'true' : 'false',
        checked: on,
        tile: 'flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; background: ' + bg + '; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #D8CFC0;',
        check: 'flex: 0 0 auto; width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' +
          (on ? 'background: #EF9F27; border: 1px solid #EF9F27;' : 'background: transparent; border: 1.5px solid rgba(237,230,218,0.3);'),
        toggle: () => this.setState({ picked: { ...this.state.picked, [name]: !on }, group: null })
      };
    });
    const n = list.filter((x) => this.state.picked[x[0]]).length;
    const seg = (on) => 'height: 32px; padding: 0 12px; border: none; border-radius: 14px; font-size: 13px; font-weight: 600; ' +
      (on ? 'background: #EDE6DA; color: #141316;' : 'background: transparent; color: #B7AE9F;');
    const mini = (bg) => 'width: 20px; height: 20px; border-radius: 6px; background: ' + bg + '; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #D8CFC0; border: 1.5px solid #0E0D0F;';
    const groupDefs = [
      ['deep', 'Deep work', '7', 'I', 'T', '#5C3344', '#2E2E33', ['Instagram', 'TikTok', 'YouTube', 'Reddit', 'X', 'Snapchat', 'Netflix']],
      ['doom', 'Doomscroll', '11', 'R', 'X', '#6B3D2A', '#26262A', ['Instagram', 'TikTok', 'YouTube', 'Reddit', 'X', 'Snapchat', 'Netflix', 'Chrome']],
      ['always', 'Always allowed', '3', 'M', 'C', '#2F4A3A', '#3A4A3A', ['Messages', 'Chrome']]
    ];
    const groups = groupDefs.map(([id, name, count, i1, i2, b1, b2, members]) => {
      const on = this.state.group === id;
      return {
        name, count, i1, i2,
        pressed: on ? 'true' : 'false',
        m1: mini(b1), m2: mini(b2) + ' margin-left: -6px;',
        style: 'flex: 0 0 auto; height: 40px; padding: 0 14px 0 8px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; ' +
          (on ? 'background: rgba(239,159,39,0.14); color: #EDE6DA; border: 1px solid rgba(239,159,39,0.6);' : 'background: rgba(237,230,218,0.05); color: #EDE6DA; border: 1px solid rgba(237,230,218,0.12);'),
        countStyle: 'font-weight: 500; color: ' + (on ? '#F4C27E' : '#B7AE9F') + ';',
        pick: () => {
          const picked = {};
          members.forEach((m) => { picked[m] = true; });
          this.setState({ group: id, picked });
        }
      };
    });
    const allow = this.state.allow;
    return {
      apps, groups,
      title: allow ? 'What stays open' : 'What rests',
      subtitle: allow ? 'Everything else is blocked while this runs.' : 'Pick a group, or tap apps one by one.',
      doneLabel: n + ' apps' + (allow ? ' allowed' : ' · 2 sites'),
      blockOn: allow ? 'false' : 'true',
      allowOn: allow ? 'true' : 'false',
      blockStyle: seg(!allow),
      allowStyle: seg(allow),
      setBlock: () => this.setState({ allow: false }),
      setAllow: () => this.setState({ allow: true })
    };
  }
}
</script>
</body>
</html>
