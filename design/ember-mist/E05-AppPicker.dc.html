<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flint — Choose apps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#EDE6DA}a:hover{color:#B7AE9F}
button{font:inherit;cursor:pointer}
input::placeholder{color:#8F887C}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0E0D0F; color: #EDE6DA; font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 200px; background: linear-gradient(180deg, #0B0D12 0%, #17161B 55%, #0E0D0F 100%)"></div>

  <div style="position: relative; display: flex; flex-direction: column; padding: 54px 20px 0 20px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="E04-StartFocus.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #EDE6DA">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <span style="font-size: 11px; font-weight: 500; letter-spacing: 2px; color: #B7AE9F">{{countLabel}}</span>
      <span style="width: 44px"></span>
    </div>

    <h1 style="margin: 10px 4px 0 4px; font-family: 'Shippori Mincho', 'Iowan Old Style', Georgia, serif; font-weight: 400; font-size: 28px; letter-spacing: -0.3px">{{title}}</h1>

    <div role="radiogroup" aria-label="Mode" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin-top: 16px; padding: 4px; border-radius: 18px; background: rgba(237, 230, 218, 0.05)">
      <button type="button" role="radio" aria-checked="{{blockOn}}" onClick="{{setBlock}}" style="{{blockStyle}}">Block list</button>
      <button type="button" role="radio" aria-checked="{{allowOn}}" onClick="{{setAllow}}" style="{{allowStyle}}">Allow list</button>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 48px; margin-top: 12px; padding: 0 16px; border-radius: 24px; background: rgba(237, 230, 218, 0.05); border: 1px solid rgba(237, 230, 218, 0.08)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B7AE9F" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search apps</span>
      <input type="search" placeholder="Search apps" style="flex: 1 1 auto; min-width: 0; height: 44px; border: none; outline: none; background: transparent; color: #EDE6DA; font: inherit; font-size: 15px">
    </label>

    <div style="display: flex; gap: 8px; margin-top: 14px">
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid rgba(237, 230, 218, 0.16); background: transparent; color: #EDE6DA; font-size: 13px; font-weight: 500">Social · 4</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid rgba(237, 230, 218, 0.16); background: transparent; color: #EDE6DA; font-size: 13px; font-weight: 500">Video · 3</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px dashed rgba(237, 230, 218, 0.22); background: transparent; color: #B7AE9F; font-size: 13px; font-weight: 500">Save as group</button>
    </div>

    <div style="display: flex; flex-direction: column; margin-top: 14px">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="7">
        <button type="button" role="checkbox" aria-checked="{{a.on}}" onClick="{{a.toggle}}" style="display: flex; align-items: center; gap: 14px; height: 54px; padding: 0 4px; border: none; border-bottom: 1px solid rgba(237, 230, 218, 0.07); background: transparent; color: #EDE6DA; text-align: left">
          <span style="{{a.tile}}">{{a.initial}}</span>
          <span style="flex: 1 1 auto; font-size: 15px">{{a.name}}</span>
          <span style="{{a.check}}">
            <sc-if value="{{a.checked}}" hint-placeholder-val="{{true}}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A2003" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 36px 20px; background: linear-gradient(180deg, rgba(14, 13, 15, 0) 0%, #0E0D0F 30%)">
    <a href="E04-StartFocus.dc.html" style="height: 56px; border-radius: 28px; background: #EDE6DA; color: #141316; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Done · {{doneLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      allow: false,
      picked: { Instagram: true, TikTok: true, YouTube: true, Reddit: true, X: true, Snapchat: true, Netflix: true }
    };
  }
  renderVals() {
    const names = ['Instagram', 'TikTok', 'YouTube', 'Reddit', 'X', 'Snapchat', 'Netflix', 'Chrome', 'Messages'];
    const tones = ['#3A3430', '#33302E', '#3D3631', '#36312D', '#2F2C2A', '#3B3530', '#35302C', '#312E2B', '#38332F'];
    const apps = names.map((name, i) => {
      const on = !!this.state.picked[name];
      return {
        name,
        initial: name[0],
        on: on ? 'true' : 'false',
        checked: on,
        tile: 'flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; background: ' + tones[i] + '; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #D8CFC0;',
        check: 'flex: 0 0 auto; width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' +
          (on ? 'background: #EF9F27; border: 1px solid #EF9F27;' : 'background: transparent; border: 1.5px solid rgba(237,230,218,0.3);'),
        toggle: () => this.setState({ picked: { ...this.state.picked, [name]: !on } })
      };
    });
    const n = names.filter((x) => this.state.picked[x]).length;
    const seg = (on) => 'height: 40px; border: none; border-radius: 14px; font-size: 14px; font-weight: 500; ' +
      (on ? 'background: #2A2826; color: #EDE6DA;' : 'background: transparent; color: #B7AE9F;');
    const allow = this.state.allow;
    return {
      apps,
      title: allow ? 'What stays open' : 'What rests',
      countLabel: n + (allow ? ' ALLOWED' : ' SELECTED'),
      doneLabel: n + ' apps' + (allow ? ' allowed' : ' · 2 sites'),
      blockOn: allow ? 'false' : 'true',
      allowOn: allow ? 'true' : 'false',
      blockStyle: seg(!allow),
      allowStyle: seg(allow),
      setBlock: () => this.setState({ allow: false }),
      setAllow: () => this.setState({ allow: true })
    };
  }
}
</script>
</body>
</html>
