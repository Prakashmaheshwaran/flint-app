org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 enables built-in Kotlin and the new DSL by default. Keep the existing
# Kotlin 2.1/Compose plugin together during this compatibility upgrade. These
# supported opt-outs must be removed during the built-in Kotlin migration,
# before AGP 10: https://developer.android.com/build/migrate-to-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
# Preserve both debug and release unit suites instead of AGP 9's debug-only default.
android.onlyEnableUnitTestForTheTestedBuildType=false

kotlin.code.style=official
